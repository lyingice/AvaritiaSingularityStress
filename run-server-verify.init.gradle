// 仅用于"隔离验证"本次无线系统改动：把 runServer 的游戏目录指到一个干净目录，
// 避免 run/mods 里的客户端专用模组（钠/iris 等）在专用服务器预启动阶段崩溃。
// 用法： .\gradlew runServer --offline --init-script run-server-verify.init.gradle
gradle.projectsEvaluated {
    def task = rootProject.tasks.findByName('runServer')
    if (task != null) {
        task.gameDirectory = rootProject.file('run-server-verify')
    }
}
